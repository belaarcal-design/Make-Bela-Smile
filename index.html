<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate to make Bela smile</title>
<style>
  :root{
    --navy:#182644;
    --navy-deep:#0f1a30;
    --cream:#FBF6EC;
    --gold:#D4A017;
    --gold-light:#F0C75E;
    --coral:#E8674A;
    --ink:#1F2933;
    --green:#3D8361;
    --line:#E4DCC8;
    --shadow: 0 10px 30px rgba(15,26,48,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--navy-deep);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--cream); -webkit-font-smoothing:antialiased;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;
    background:
      radial-gradient(circle at 20% 0%, #223357 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #1c2b4d 0%, transparent 40%),
      var(--navy-deep);
    padding-bottom:40px;
  }
  .hidden{display:none !important;}

  /* ---- top banner ---- */
  .banner{padding:28px 20px 18px; text-align:center;}
  .banner .kicker{font-size:13px;letter-spacing:.3px;color:var(--gold-light);opacity:.9;margin-bottom:6px;}
  .banner h1{font-size:22px;line-height:1.3;margin:0 0 4px;font-weight:700;color:var(--cream);}
  .banner .sub{font-size:14px;color:#B9C4DC;margin:0;}

  /* ---- entry screen ---- */
  .entry-wrap{padding:10px 20px 30px;}
  .entry-card{background:var(--cream);color:var(--ink);border-radius:18px;padding:20px;
    box-shadow:var(--shadow); margin-bottom:16px;}
  .entry-card h2{margin:0 0 12px;font-size:16px;color:var(--navy);}
  label{display:block;font-size:12.5px;color:#5b6577;margin:10px 0 5px;}
  input[type=text], input[type=number], input[type=password]{
    width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:16px;color:var(--ink);
  }
  input:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  select{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:16px;color:var(--ink);}
  select:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .hint{font-size:12.5px;color:#5b6577;margin:0 0 4px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:12px;padding:12px 16px;font-size:14.5px;font-weight:600;
    cursor:pointer;width:100%;margin-top:12px;transition:transform .1s ease, opacity .15s ease;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--gold);color:var(--navy-deep);}
  .btn-secondary{background:var(--navy);color:var(--cream);}
  .btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn-danger{background:var(--coral);color:#fff;}
  .btn-small{width:auto;padding:8px 12px;font-size:13px;margin-top:0;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .err{color:var(--coral);font-size:13px;margin-top:8px;}
  .divider-or{text-align:center;color:#8892a4;font-size:12px;margin:16px 0 6px;position:relative;}

  /* ---- challenge screen ---- */
  .code-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15); color:var(--gold-light); font-size:12.5px;
    padding:5px 10px;border-radius:999px; margin-top:8px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0;}
  .icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
    color:var(--cream);border-radius:10px;padding:7px 10px;font-size:12.5px;cursor:pointer;}

  .photo-card{margin:16px 18px;background:linear-gradient(180deg,#1c2b4d,#16223e);
    border-radius:20px;padding:22px 18px 18px;box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.06); text-align:center;}
  .morph-frame{width:150px;height:150px;border-radius:50%;margin:0 auto 14px;position:relative;
    border:4px solid var(--gold); box-shadow:0 6px 18px rgba(0,0,0,.4); overflow:hidden;
    background:#0c1728;}
  .morph-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transition:opacity .9s ease;}
  .morph-frame .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:38px;color:#3a4a6b;}
  .pin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:20px;}
  .goal-line{font-size:13.5px;color:#B9C4DC;margin-bottom:10px;}
  .goal-line b{color:var(--gold-light);}
  .progress-outer{height:10px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:8px 0 8px;}
  .progress-inner{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));
    border-radius:99px;transition:width .6s ease;}
  .saved-line{font-size:13px;color:var(--cream);}
  .saved-line b{color:var(--gold-light);font-size:15px;}

  .section-card{margin:16px 18px;background:var(--cream);color:var(--ink);border-radius:18px;
    padding:16px;box-shadow:var(--shadow);}
  .section-title{font-size:14.5px;font-weight:700;color:var(--navy);margin:0 0 10px;
    display:flex;align-items:center;justify-content:space-between;}
  .tag{font-size:10.5px;font-weight:700;background:var(--gold);color:var(--navy-deep);
    padding:2px 7px;border-radius:99px;}

  /* leaderboard */
  .lb-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{width:26px;text-align:center;font-weight:700;color:var(--navy);font-size:13.5px;}
  .lb-rank.medal{font-size:16px;}
  .lb-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;
    background:var(--navy);color:var(--gold-light);display:flex;align-items:center;
    justify-content:center;font-size:13px;font-weight:700;}
  .lb-name{flex:1;font-size:14px;color:var(--ink);font-weight:600;}
  .lb-name small{display:block;font-weight:400;color:#8892a4;font-size:11.5px;}
  .lb-amt{font-size:13.5px;font-weight:700;color:var(--green);}

  /* my-avatar control in topbar */
  .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#B9C4DC;}
  .who b{color:var(--cream);}
  .my-avatar-wrap{position:relative;width:32px;height:32px;flex-shrink:0;cursor:pointer;}
  .my-avatar-wrap .lb-avatar{width:32px;height:32px;border:1.5px solid rgba(255,255,255,.25);}
  .my-avatar-wrap::after{content:"📷";position:absolute;bottom:-3px;right:-3px;font-size:10px;
    background:var(--gold);border-radius:50%;width:15px;height:15px;display:flex;
    align-items:center;justify-content:center;}

  /* envelope grid */
  .grid-hint{font-size:12.5px;color:#5b6577;margin:0 0 10px;}
  .env-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .env{aspect-ratio:1;border-radius:10px;border:1.6px solid var(--line);background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:700;color:var(--navy);cursor:pointer;position:relative;
    transition:transform .08s ease;}
  .env:active{transform:scale(0.94);}
  .env.approved{background:#EAF6EF;border-color:var(--green);color:var(--green);}
  .env.pending{background:#FFF6E0;border-color:var(--gold);color:#8a6d00;}
  .env.pending.mine::after{content:"⏳";position:absolute;top:2px;right:4px;font-size:9px;}
  .env .own{font-size:8.5px;font-weight:500;color:#8892a4;margin-top:1px;max-width:90%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .env.approved .own{color:var(--green);}
  .env.locked-empty{opacity:.5;cursor:not-allowed;}
  .env.selectable{cursor:pointer;}
  .env.selected{background:#FFF6E0;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}
  .env.selected::after{content:"✓";position:absolute;top:2px;right:4px;font-size:10px;color:#8a6d00;font-weight:900;}

  .select-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:#FFF6E0;border:1.5px solid var(--gold);border-radius:10px;padding:8px 10px;
    margin-top:10px;font-size:12.5px;color:#8a6d00;font-weight:600;}
  .select-bar .btn{margin-top:0;width:auto;flex-shrink:0;}

  .actions-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .actions-row .btn{margin-top:0;flex:1;min-width:120px;}

  /* pending review list (admin) */
  .review-item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);}
  .review-item:last-child{border-bottom:none;}
  .review-thumb-wrap{position:relative;flex-shrink:0;}
  .review-thumb{width:76px;height:76px;border-radius:12px;object-fit:cover;border:1.5px solid var(--line);
    cursor:pointer;display:block;}
  .review-thumb-wrap::after{content:"🔍";position:absolute;bottom:-4px;right:-4px;font-size:13px;
    background:#fff;border:1px solid var(--line);border-radius:50%;width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .review-info{flex:1;font-size:12.5px;color:#5b6577;}
  .review-info b{color:var(--ink);}
  .review-btns{display:flex;gap:6px;}
  .review-btns button{border:none;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer;}
  .approve-b{background:var(--green);color:#fff;}
  .reject-b{background:var(--coral);color:#fff;}
  .empty-note{font-size:12.5px;color:#8892a4;text-align:center;padding:8px 0;}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,15,28,.6);display:flex;
    align-items:flex-end;justify-content:center;z-index:50;}
  .modal-sheet{background:var(--cream);color:var(--ink);width:100%;max-width:480px;
    border-radius:20px 20px 0 0;padding:18px 18px 26px;max-height:85vh;overflow-y:auto;}
  .modal-sheet h3{margin:0 0 14px;color:var(--navy);font-size:16.5px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;color:#8892a4;cursor:pointer;}
  .mini-photo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 4px;}
  .mini-photo{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--line);background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    position:relative;cursor:pointer;font-size:10px;color:#8892a4;}
  .mini-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .mini-photo span.lbl{position:absolute;bottom:2px;background:rgba(0,0,0,.55);color:#fff;
    font-size:8.5px;padding:1px 4px;border-radius:6px;}

  /* image preview modal */
  .img-modal-sheet{background:var(--cream);color:var(--ink);width:100%;max-width:480px;
    border-radius:20px 20px 0 0;padding:16px 16px 24px;max-height:90vh;overflow-y:auto;text-align:center;}
  .img-modal-sheet img{width:100%;border-radius:14px;display:block;margin-top:6px;box-shadow:var(--shadow);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;
    border-top:1px solid var(--line);margin-top:10px;}
  .toggle-row span{font-size:13.5px;color:var(--ink);}
  .switch{width:42px;height:24px;border-radius:99px;background:#d8dee8;position:relative;cursor:pointer;
    transition:background .2s;flex-shrink:0;}
  .switch.on{background:var(--green);}
  .switch .dot{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;
    transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch.on .dot{left:21px;}
  .admin-badge{font-size:11px;background:var(--navy);color:var(--gold-light);padding:3px 8px;
    border-radius:99px;font-weight:700;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);
    color:var(--cream);padding:10px 18px;border-radius:99px;font-size:13px;box-shadow:var(--shadow);
    z-index:80;opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .toast.show{opacity:1;}
  .footer-note{text-align:center;font-size:11px;color:#5b6d92;padding:20px 20px 0;}
  input[type=file]{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

/* Static first-paint fallback */
.top-banner{margin:0 16px;padding:12px 14px;border-radius:14px;background:#223357;color:#F0C75E;font-weight:700;text-align:center;}
.entry-wrap{padding:24px 18px 40px;}
.entry-wrap h1{margin:8px 0 6px;text-align:center;font-size:30px;line-height:1.1;color:#FBF6EC;}
.entry-wrap .sub{text-align:center;color:#B9C4DC;margin:0 0 24px;}
.card{background:#FBF6EC;color:#1F2933;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 10px 30px rgba(15,26,48,.35);}
.card h2{margin:0 0 16px;color:#182644;font-size:20px;}
.card label{display:block;margin:11px 0 6px;font-size:13px;font-weight:700;color:#596273;}
.card input{width:100%;padding:13px 14px;border:1px solid #E4DCC8;border-radius:12px;font-size:16px;box-sizing:border-box;background:#fff;}
.card button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#D4A017;color:#182644;font-weight:800;font-size:16px;cursor:pointer;}
.footer-note{text-align:center;color:#B9C4DC;font-size:12px;line-height:1.5;margin:20px 10px;}

/* ---- small-phone safeguard (iPhone SE, older/compact Androids ~320-360px) ---- */
@media (max-width:360px){
  .env-grid, .mini-photo-grid{grid-template-columns:repeat(4,1fr);}
  .banner h1, .entry-wrap h1{font-size:20px;}
  .actions-row .btn{min-width:100px;font-size:13.5px;}
  .photo-card{margin:16px 10px;padding:18px 12px 14px;}
  .section-card{margin:16px 10px;padding:14px;}
}

/* ===== Belights yellow theme (matches the banner) ===== */
:root{
  --navy:#7A5A0A; --navy-deep:#4A3606;
  --cream:#FFFBEA; --gold:#F2B90F; --gold-light:#F6C943;
  --ink:#4A3606; --line:#F0E0A8;
  --shadow:0 10px 30px rgba(184,134,11,.22);
}
html,body{background:#FFF1BF !important;color:#4A3606 !important;}
#app{background:
  radial-gradient(circle at 15% 0%, #FFE48A 0%, transparent 45%),
  radial-gradient(circle at 95% 8%, #FFEFB0 0%, transparent 40%),
  linear-gradient(180deg,#FFF6D2,#FFF1BF) !important;}
.banner h1,.entry-wrap h1,.saved-line,.who b,.icon-btn{color:#5A4310 !important;}
.banner .sub,.entry-wrap .sub,.goal-line,.who,.footer-note{color:#8A6A1B !important;}
.goal-line b,.saved-line b{color:#B8860B !important;}
.kicker,.banner .kicker{color:#B8860B !important;}
.code-pill{background:rgba(255,255,255,.7) !important;border-color:#F0D77A !important;color:#7A5A0A !important;}
.icon-btn{background:rgba(255,255,255,.7) !important;border-color:#F0D77A !important;}
.top-banner{background:#FFE9A3 !important;color:#7A5A0A !important;}
.photo-card{background:linear-gradient(180deg,#FFFFFF,#FFF4CC) !important;border:1px solid #F0D77A !important;}
.morph-frame{background:#fff !important;box-shadow:0 6px 18px rgba(184,134,11,.3) !important;}
.morph-frame .ph{color:#E8C25A !important;}
.progress-outer{background:rgba(122,90,10,.14) !important;}
.progress-inner{background:linear-gradient(90deg,#F2B90F,#F6C943) !important;}
.entry-card,.section-card,.card,.modal-sheet,.img-modal-sheet{background:#FFFFFF !important;color:#4A3606 !important;}
.card h2,.entry-card h2,.section-title,.modal-sheet h3{color:#7A5A0A !important;}
.card button{color:#4A3606 !important;background:#F2B90F !important;}
.btn-primary{background:#F2B90F !important;color:#4A3606 !important;}
.btn-outline{color:#7A5A0A !important;border-color:#E3B93A !important;}
.footer-note,.divider-or{color:#9A7B2A !important;}
.my-avatar-wrap .lb-avatar{border-color:#F0D77A !important;}
.toast{background:#7A5A0A !important;color:#FFFBEA !important;}
</style>
</head>
<body>
<div id="app">
  <div class="top-banner">💛 Group savings challenge</div>
  <section class="entry-wrap">
    <h1>Donate to make Bela smile</h1>
    <p class="sub">Ipon Challenge 🙂 — save together, track together</p>
    <div class="card">
      <h2>Join an existing challenge</h2>
      <label>Your name</label>
      <input type="text" placeholder="Enter your name" autocomplete="name">
      <label>Join code</label>
      <input type="text" placeholder="e.g. ABC12" autocomplete="off">
      <button type="button">Join challenge</button>
    </div>
    <div class="card">
      <h2>Start a new challenge</h2>
      <p class="footer-note" style="margin:0;">⚙️ Admin only — loading…</p>
    </div>
    <p class="footer-note">Your challenge stays active until the goal is reached. Only admins can manage or end it.</p>
  </section>
</div>
<div id="toast" class="toast"></div>
<div id="errBanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:999;
  background:#E8674A;color:#fff;font-size:12.5px;padding:10px 14px;
  font-family:monospace;word-break:break-word;box-shadow:0 4px 10px rgba(0,0,0,.3);">
  <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
    <div id="errBannerText" style="flex:1;"></div>
    <button id="errBannerCopy" style="flex-shrink:0;background:#fff;color:#E8674A;border:none;
      border-radius:6px;padding:4px 8px;font-weight:700;font-size:11px;cursor:pointer;">Copy</button>
    <button id="errBannerClose" style="flex-shrink:0;background:none;border:none;color:#fff;
      font-size:16px;cursor:pointer;line-height:1;">✕</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" async crossorigin="anonymous"></script>
<script>
/* ================= Supabase (shared/multiplayer storage) =================
   Plain REST calls (no library needed). Table: public.ipon_kv (key, value).
   If Supabase is unreachable, sget/sset quietly fall back to localStorage,
   so the app still works on one device instead of breaking. */
const SUPABASE_URL = "https://ntcdqdfhblmcgbypnkwk.supabase.co";
const SUPABASE_KEY = "sb_publishable_9mQYTiI4h0Nr2Sjb1qVJ6A_9W9Wojsk";
const SB_TABLE = SUPABASE_URL + "/rest/v1/ipon_kv";
const SB_HEADERS = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };

async function supaGet(key){
  const r = await fetch(SB_TABLE + "?select=value&key=eq." + encodeURIComponent(key), { headers: SB_HEADERS });
  if (!r.ok) throw new Error("Supabase read failed: " + r.status);
  const rows = await r.json();
  return rows.length ? rows[0].value : null;
}
async function supaSet(key, json){
  const r = await fetch(SB_TABLE + "?on_conflict=key", {
    method: "POST",
    headers: Object.assign({ Prefer: "resolution=merge-duplicates,return=minimal" }, SB_HEADERS),
    body: JSON.stringify({ key: key, value: json, updated_at: new Date().toISOString() })
  });
  if (!r.ok) throw new Error("Supabase write failed: " + r.status);
}

/* ================= storage helpers ================= */
// shared=true  -> Supabase, so every device/person sees the same data (multiplayer)
// shared=false -> localStorage only, per-device (e.g. "which member am I on this phone")
async function sget(key, shared){
  if (shared){
    try{
      const json = await supaGet(key);
      if (json != null) return JSON.parse(json);
      return null;
    }catch(e){
      // Supabase down/unavailable — fall through to the local cache below
      // so the app still works (just not synced) instead of breaking.
    }
  }
  try{
    const v = localStorage.getItem((shared ? 'shared:' : 'local:') + key);
    return v == null ? null : JSON.parse(v);
  }catch(e){ return null; }
}
async function sset(key, value, shared){
  const json = JSON.stringify(value);
  let sharedOk = false;
  if (shared){
    try{
      await supaSet(key, json);
      sharedOk = true;
    }catch(e){
      console.error('Supabase write failed, saved locally only:', e);
    }
  }
  // Always mirror to localStorage too — keeps a local cache for offline
  // reads and is the only store used for shared=false (per-device) data.
  // If Supabase is unavailable, a successful local write still counts as
  // "saved" (single-device mode) rather than reporting failure to the user —
  // that's the local-only fallback the app is designed to have.
  let localOk = false;
  try{ localStorage.setItem((shared ? 'shared:' : 'local:') + key, json); localOk = true; }catch(e){}
  const ok = sharedOk || localOk;
  if (!ok) console.error('storage set failed', key);
  return ok;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
// Safety net: several actions (uploading a receipt, saving settings, etc.)
// run multi-step async chains. Without this, an unexpected failure partway
// through (bad/unsupported image file, a storage hiccup, etc.) throws and
// the promise rejection is silently swallowed — the UI just does nothing,
// which is confusing and looks like the app is broken. Surface the real
// error text on-screen (not just the console, which isn't reachable on
// most phones) so it can be read or screenshotted.
function showErrBanner(text){
  const el = document.getElementById('errBanner');
  const txt = document.getElementById('errBannerText');
  if (!el || !txt) return;
  txt.textContent = text;
  el.style.display = 'block';
}
window.addEventListener('unhandledrejection', (e) => {
  let msg = e.reason && e.reason.message;
  if (!msg || /^\[object /.test(msg)) msg = 'Something went wrong — please try again.';
  console.error('Unhandled error:', e.reason);
  toast('⚠️ Something went wrong — please try again');
  showErrBanner('Error: ' + msg);
});
window.addEventListener('error', (e) => {
  console.error('Script error:', e.error || e.message);
  // Browsers report errors from other origins (in-app browsers like Messenger/Facebook,
  // extensions, CDN scripts) as a bare "Script error." with no file, line or Error object.
  // That is not a bug in this app and nothing here is broken, so don't show the red banner.
  const msg = (e && e.message) || '';
  if (!e.error && (!e.filename || /^script error\.?$/i.test(msg))) return;
  showErrBanner('Error: ' + (e.error && e.error.message ? e.error.message : msg));
});
function uid(n){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<n;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function peso(n){ return '₱' + Number(n||0).toLocaleString(); }
function initials(name){
  const parts = (name||'?').trim().split(/\s+/);
  return (((parts[0] && parts[0][0])||'') + (parts.length>1 ? parts[parts.length-1][0] : '')).toUpperCase() || '?';
}
function avatarHtml(member, extraClass){
  const cls = 'lb-avatar' + (extraClass ? ' ' + extraClass : '');
  if (member && member.avatar) return `<img class="${cls}" src="${member.avatar}">`;
  return `<div class="${cls}">${initials(member && member.name)}</div>`;
}

/* download a single receipt image to the user's device */
function downloadDataUrl(dataUrl, filename){
  if (!dataUrl) { toast('No photo to download'); return; }
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* bundle every saved receipt into one ZIP the admin can download */
async function exportAllReceipts(){
  if (typeof JSZip === 'undefined'){ toast('Export tool failed to load — check your connection'); return; }
  const boxes = state.boxes || [];
  const withReceipts = boxes.map((b,i)=>({b,i})).filter(x => x.b.receipt);
  if (!withReceipts.length){ toast('No receipts saved yet'); return; }

  toast('Zipping receipts…');
  const zip = new JSZip();
  withReceipts.forEach(({b,i}) => {
    const owner = state.members[b.ownerId] ? state.members[b.ownerId].name.replace(/[^a-z0-9]/gi,'_') : 'unknown';
    const ext = (b.receipt.match(/^data:image\/(\w+);/) || [,'jpg'])[1];
    const base64 = b.receipt.split(',')[1];
    zip.file(`box-${String(i+1).padStart(2,'0')}-${owner}.${ext}`, base64, { base64: true });
  });
  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${state.code || 'ipon'}-receipts.zip`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast(`Downloaded ${withReceipts.length} receipt(s)`);
}

/* compress an image file to a small base64 jpeg */
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if (!file || !file.type || !file.type.startsWith('image/')){
      reject(new Error('That file doesn\'t look like a photo — please pick an image.'));
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read that photo — try a different one.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not open that file — try picking the photo again.'));
    reader.readAsDataURL(file);
  });
}

function keyMeta(c){ return `ipon:${c}:meta`; }
function keyPhotos(c){ return `ipon:${c}:photos`; }
function keyPhoto(c, slot){ return `ipon:${c}:photo:${slot}`; }
function keyBoxes(c){ return `ipon:${c}:boxes`; }
function keyBoxReceipt(c, i){ return `ipon:${c}:receipt:${i}`; }
function keyMembers(c){ return `ipon:${c}:members`; }
function keyAvatar(c, memberId){ return `ipon:${c}:avatar:${memberId}`; }
function keyMine(c){ return `ipon-me:${c}`; }

function defaultBoxes(n, amount){
  return Array.from({length:n}, () => ({status:'empty', ownerId:null, amount, receipt:null, ts:null}));
}

async function createGroup(name, goal, boxAmount, numBoxes, adminName, adminPin, title, subtitle){
  const code = uid(5);
  const memberId = 'm_' + uid(6);
  const meta = {
    title: (title||"").trim() || "Donate to make Bela smile",
    subtitle: (subtitle||"").trim() || "Ipon Challenge 🙂",
    goal: Number(goal) || 10000,
    boxAmount: Number(boxAmount) || 400,
    numBoxes: Number(numBoxes) || 25,
    locked: false,
    status: 'active',
    hidePending: false,
    admins: [{ name: adminName || name, pin: adminPin }],
    createdAt: Date.now()
  };
  const photos = {};
  const boxes = defaultBoxes(meta.numBoxes, meta.boxAmount);
  const members = { [memberId]: { name, joinedAt: Date.now() } };

  await sset(keyMeta(code), meta, true);
  // Keep each milestone photo in its own storage key so one large photo
  // cannot make the whole challenge record too large.
  await Promise.all(Object.entries(photos).map(([slot, data]) => sset(keyPhoto(code, slot), data, true)));
  // Legacy index is kept tiny for compatibility; actual image data is per-key.
  await sset(keyPhotos(code), {}, true);
  await sset(keyBoxes(code), boxes, true);
  await sset(keyMembers(code), members, true);

  state.me = { memberId, name, isAdmin: true };
  await sset(keyMine(code), state.me, false);

  state.code = code; state.meta = meta; state.photos = photos; state.boxes = boxes; state.members = members;
  enterChallenge();
}

async function joinGroup(code, name, existingMemberId){
  code = code.trim().toUpperCase();
  const meta = await sget(keyMeta(code), true);
  if (!meta){ state.entryErr = "Couldn't find a challenge with that code."; render(); return; }
  let photos = await sget(keyPhotos(code), true) || {};
  const photoSlots = ['m0','m25','m50','m75','m100'];
  const photoValues = await Promise.all(photoSlots.map(slot => sget(keyPhoto(code, slot), true)));
  photoSlots.forEach((slot, n) => { if (photoValues[n]) photos[slot] = photoValues[n]; });
  const boxes = await sget(keyBoxes(code), true) || [];
  // Hydrate receipts from their individual storage keys.
  const receiptValues = await Promise.all(boxes.map((b, i) => sget(keyBoxReceipt(code, i), true)));
  boxes.forEach((b, i) => { if (receiptValues[i]) b.receipt = receiptValues[i]; });
  // Migrate older challenges whose receipts were stored inside the boxes array.
  await Promise.all(boxes.map(async (b, i) => {
    if (b.receipt && !receiptValues[i]) await sset(keyBoxReceipt(code, i), b.receipt, true);
  }));
  const members = await sget(keyMembers(code), true) || {};
  // Hydrate profile pics from their individual storage keys (same pattern as
  // milestone photos / receipts — keeps each avatar out of the shared members blob).
  const memberIds = Object.keys(members);
  const avatarValues = await Promise.all(memberIds.map(id => sget(keyAvatar(code, id), true)));
  memberIds.forEach((id, n) => { if (avatarValues[n]) members[id].avatar = avatarValues[n]; });

  let mine = await sget(keyMine(code), false);
  let memberId = mine && mine.memberId ? mine.memberId : null;
  let isAdmin = mine ? !!mine.isAdmin : false;
  // New browser/device, same name: reuse the existing member instead of
  // creating a duplicate (case- and space-insensitive match).
  if (!memberId || !members[memberId]){
    const norm = v => String(v||'').trim().replace(/\s+/g,' ').toLowerCase();
    const wanted = norm(name);
    const match = wanted ? Object.keys(members).find(id => norm(members[id].name) === wanted) : null;
    memberId = match || ('m_' + uid(6));
  }

  if (!members[memberId]){
    members[memberId] = { name, joinedAt: Date.now() };
    await sset(keyMembers(code), stripAvatars(members), true);
  }
  state.me = { memberId, name: members[memberId].name, isAdmin };
  await sset(keyMine(code), state.me, false);

  state.code = code; state.meta = meta; state.photos = photos; state.boxes = boxes; state.members = members;
  enterChallenge();
}

/* Lets an admin jump straight to a challenge's Settings from the main page,
   using just the join code + their admin PIN — without becoming a member
   (no name entered, nothing added to the members list). */
async function openAdminSettingsFromEntry(code, pin){
  code = (code || '').trim().toUpperCase();
  const meta = await sget(keyMeta(code), true);
  if (!meta){ toast('Challenge not found — check the join code'); return; }
  const match = (meta.admins || []).find(a => a.pin === pin);
  if (!match){ toast('Wrong admin PIN'); return; }

  const boxes = await sget(keyBoxes(code), true) || [];
  const photos = await sget(keyPhotos(code), true) || {};
  const photoSlots = ['m0','m25','m50','m75','m100'];
  const photoValues = await Promise.all(photoSlots.map(slot => sget(keyPhoto(code, slot), true)));
  photoSlots.forEach((slot, n) => { if (photoValues[n]) photos[slot] = photoValues[n]; });

  state.code = code;
  state.meta = meta;
  state.boxes = boxes;
  state.photos = photos;
  state.me = { memberId: null, name: match.name, isAdmin: true };
  state.showAdminSettingsPrompt = false;

  render();
  openSettings();
}

/* ---- "recent challenges" list, kept on this device only, so returning
   joiners can find a challenge again without retyping the code ---- */
function getRecentChallenges(){
  try {
    const list = JSON.parse(localStorage.getItem('ipon:recents') || '[]');
    return Array.isArray(list) ? list.slice(0, 5) : [];
  } catch(e) { return []; }
}
function saveRecentChallenge(){
  if (!state.code || !state.meta) return;
  try {
    let list = getRecentChallenges().filter(r => r.code !== state.code);
    list.unshift({
      code: state.code,
      title: state.meta.title,
      name: state.me.name,
      status: state.meta.status || 'active'
    });
    localStorage.setItem('ipon:recents', JSON.stringify(list.slice(0, 5)));
  } catch(e) { /* localStorage unavailable — skip silently */ }
}

let pollTimer = null;
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(refreshLive, 5000);
}

const MILESTONE_SLOTS = ['m0','m25','m50','m75','m100'];

async function refreshLive(){
  if (!state.code) return;
  const [meta, photosIndex, boxes, members, photoValues] = await Promise.all([
    sget(keyMeta(state.code), true),
    sget(keyPhotos(state.code), true),
    sget(keyBoxes(state.code), true),
    sget(keyMembers(state.code), true),
    // Milestone photos live in their own per-slot keys, not in the (always-empty)
    // legacy `photosIndex` object, so they must be re-fetched every poll to pick
    // up changes an admin makes after other members have already joined.
    Promise.all(MILESTONE_SLOTS.map(slot => sget(keyPhoto(state.code, slot), true))),
  ]);
  if (meta) state.meta = meta;
  state.photos = {...(state.photos||{}), ...(photosIndex||{})};
  MILESTONE_SLOTS.forEach((slot, n) => { if (photoValues[n]) state.photos[slot] = photoValues[n]; });
  if (boxes){
    const receiptValues = await Promise.all(boxes.map((b, i) => b.receipt ? Promise.resolve(b.receipt) : sget(keyBoxReceipt(state.code, i), true)));
    boxes.forEach((b, i) => { if (receiptValues[i]) b.receipt = receiptValues[i]; });
    state.boxes = boxes;
    state.selected = state.selected.filter(i => boxes[i] && boxes[i].status === 'empty');
  }
  if (members){
    const prevMembers = state.members || {};
    // Re-fetch every member's avatar every poll (not just ones we've never seen
    // one for) so a changed profile photo propagates to already-connected clients.
    const memberIds = Object.keys(members);
    const avatarValues = await Promise.all(memberIds.map(id => sget(keyAvatar(state.code, id), true)));
    memberIds.forEach((id, n) => {
      if (avatarValues[n]) members[id].avatar = avatarValues[n];
      else if (prevMembers[id] && prevMembers[id].avatar) members[id].avatar = prevMembers[id].avatar;
    });
    state.members = members;
  }
  render();
  checkMyNotifications();
}

async function onEnvClick(i){
  const box = state.boxes[i];
  if (box.status === 'empty'){
    if (state.meta.status === 'ended'){ toast('Challenge has ended.'); return; }
    if (state.meta.locked){ toast('Challenge is locked — ask an admin to unlock it.'); return; }
    if (state.me.isAdmin){ openBehalfModal([i]); return; }
    pickPhoto(file => uploadReceipt([i], file));
    return;
  }
  if (box.status === 'pending'){
    if (state.me.isAdmin){ openReview(i); return; }
    if (box.ownerId === state.me.memberId){ toast('Waiting for admin approval'); }
    else { toast('Someone is reviewing this one'); }
    return;
  }
  if (box.status === 'approved'){
    if (state.me.isAdmin){ openManageApproved(i); return; }
    const owner = state.members[box.ownerId];
    toast((owner ? owner.name : 'Someone') + ' saved ' + peso(box.amount));
  }
}

/* ---- notifications (for uploaders when their receipt gets approved) ---- */
function keyNotifs(c){ return `ipon:${c}:notifs`; }
async function pushNotification(memberId, boxIndex, amount){
  const notifs = await sget(keyNotifs(state.code), true) || [];
  notifs.push({ id: uid(8), memberId, boxIndex, amount, ts: Date.now(), read:false });

async function checkMyNotifications(){
  if (!state.code || !state.me.memberId) return;
  const notifs = await sget(keyNotifs(state.code), true);
  if (!notifs || !notifs.length) return;
  const mine = notifs.filter(n => n.memberId === state.me.memberId && !n.read);
  if (!mine.length) return;
  if (mine.length === 1){
    toast('✅ Box #' + (mine[0].boxIndex + 1) + ' (' + peso(mine[0].amount) + ') approved!');
  } else {
    toast('✅ ' + mine.length + ' of your receipts were approved!');
  }
  const updated = notifs.map(n => (n.memberId === state.me.memberId && !n.read) ? {...n, read:true} : n);
  await sset(keyNotifs(state.code), updated, true);
}

async function saveSettings(patch){
  if (!state.me.isAdmin){ toast('Only admins can change challenge settings'); return; }
  const meta = await sget(keyMeta(state.code), true) || state.meta;
  Object.assign(meta, patch);
  let ok = await sset(keyMeta(state.code), meta, true);
  if (!ok){ toast('⚠️ Could not save — try again'); return; }
  state.meta = meta;

  // resize boxes array if numBoxes/boxAmount changed
  let boxes = await sget(keyBoxes(state.code), true) || state.boxes;
  if (boxes.length !== meta.numBoxes){
    if (boxes.length < meta.numBoxes){
      boxes = boxes.concat(defaultBoxes(meta.numBoxes - boxes.length, meta.boxAmount));
    } else {
      boxes = boxes.slice(0, meta.numBoxes);
    }
    ok = await sset(keyBoxes(state.code), boxes, true);
    if (!ok){ toast('⚠️ Settings saved, but box count failed — try again'); state.boxes = state.boxes; render(); return; }
  }
  state.boxes = boxes;
  toast('Settings saved');
  render();
}

    const ok = await sset(keyBoxes(state.code), boxes, true);
    if (!ok){ toast('⚠️ Could not reset — try again'); return; }
    // Clear each box's stored receipt image too, not just the boxes array.
    await Promise.all((state.boxes||[]).map((_, i) => sset(keyBoxReceipt(state.code, i), null, true)));

      ...['m0','m25','m50','m75','m100'].map(slot => sset(keyPhoto(code, slot), null, true)),

async function shuffleBoxAmounts(min, max){

  const boxes = await sget(keyBoxes(state.code), true) || state.boxes;
  let changed = 0;
  boxes.forEach(b => {
    if (b.status === 'empty'){
      b.amount = Math.round(min + Math.random() * (max - min));
      changed++;
    }

  if (!changed){ toast('No empty boxes to randomize — everything is already saved or pending.'); return; }
  const ok = await sset(keyBoxes(state.code), boxes, true);
  if (!ok){ toast('⚠️ Could not save — try again'); return; }
  state.boxes = boxes;
  toast(`Shuffled ${changed} box(es). Boxes now total ${peso(boxesTotal())} (goal ${peso(state.meta.goal)})`);
  render();
}

async function endChallenge(){

/* ================= uploads (shared by members and admins) ================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normName(v){ return String(v||'').trim().replace(/\s+/g,' ').toLowerCase(); }
// avatars live under their own storage keys — never copy them into the shared members record
function stripAvatars(members){
  const clean = {};
  Object.keys(members).forEach(id => { const m = Object.assign({}, members[id]); delete m.avatar; clean[id] = m; });
  return clean;
}

// Opens the phone's photo picker. The <input> is attached to <body> (not #app) so the
// 5-second live refresh can't remove it while the gallery is open.
let activePicker = null;
function pickPhoto(onFile){
  if (activePicker){ activePicker.remove(); activePicker = null; }
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  document.body.appendChild(input);
  activePicker = input;
  input.onchange = async () => {
    try {
      const file = input.files[0];
      if (!file) return;
      await onFile(file);
    } finally {
      input.remove();
      if (activePicker === input) activePicker = null;
    }
  };
  input.click();
}

// Finds (or creates) the member an admin is uploading for.
async function resolveOwner(who){
  if (!who.newName) return who.ownerId || state.me.memberId;
  const members = await sget(keyMembers(state.code), true) || {};
  const wanted = normName(who.newName);
  let id = Object.keys(members).find(k => normName(members[k].name) === wanted);
  if (!id){
    id = 'm_' + uid(6);
    members[id] = { name: who.newName.trim(), joinedAt: Date.now(), addedByAdmin: true };
    const ok = await sset(keyMembers(state.code), stripAvatars(members), true);
    if (!ok) throw new Error('Could not add that person — please try again.');
  }
  if (!state.members) state.members = {};
  if (!state.members[id]) state.members[id] = { name: members[id].name };
  return id;
}

// who (admins only): { ownerId | newName, autoApprove }
async function uploadReceipt(indexes, file, who){
  if (state.meta.status === 'ended'){ toast('Challenge has ended.'); return; }
  toast('Uploading receipt…');
  const dataUrl = await compressImage(file, 500, 0.55);
  const onBehalf = !!(who && state.me.isAdmin);
  const ownerId = onBehalf ? await resolveOwner(who) : state.me.memberId;
  const approveNow = onBehalf && !!who.autoApprove;

  const boxes = await sget(keyBoxes(state.code), true) || state.boxes;
  const targets = indexes.filter(i => boxes[i] && boxes[i].status === 'empty');
  if (!targets.length){ toast('Those boxes were just taken — please pick again.'); return; }

  // each receipt photo is stored under its own key; the shared boxes record stays small
  const savedAll = await Promise.all(targets.map(i => sset(keyBoxReceipt(state.code, i), dataUrl, true)));
  if (savedAll.some(ok => !ok)){ toast('⚠️ Could not save receipt — try again'); return; }
  const ts = Date.now();
  targets.forEach(i => {
    boxes[i] = { status: approveNow ? 'approved' : 'pending', ownerId, amount: boxes[i].amount, receipt: null, ts };
  });
  const ok = await sset(keyBoxes(state.code), boxes, true);
  if (!ok){ toast('⚠️ Could not save — try again'); return; }

  // keep receipt photos already on screen, then attach the new one
  boxes.forEach((b, i) => {
    const old = state.boxes && state.boxes[i];
    if (!b.receipt && old && old.receipt && b.status !== 'empty') b.receipt = old.receipt;
  });
  targets.forEach(i => { boxes[i].receipt = dataUrl; });
  state.boxes = boxes;
  state.selectMode = false; state.selected = [];

  const ownerName = (state.members && state.members[ownerId]) ? state.members[ownerId].name : 'member';
  const many = targets.length > 1;
  if (approveNow){
    if (ownerId !== state.me.memberId){
      for (const i of targets) await pushNotification(ownerId, i, boxes[i].amount);
    }
    toast('✅ Saved & approved for ' + ownerName + (many ? ' (' + targets.length + ' boxes)' : ''));
    if (savedTotal() >= Number(state.meta.goal||0)){
      setTimeout(() => toast('Goal reached 🎉 — admin can now end the challenge.'), 2400);
    }
  } else if (onBehalf){
    toast('Receipt submitted for ' + ownerName + ' — pending approval');
  } else if (many){
    toast('One receipt submitted for ' + targets.length + ' box(es) — waiting for admin approval');
  } else {
    toast('Receipt submitted — waiting for admin approval');
  }
  render();
}

// Admin: choose which team member the receipt is for (or add someone new), then pick the photo.

  const members = state.members || {};

  const label = indexes.length === 1 ? 'Box #' + (indexes[0] + 1) : indexes.length + ' boxes';

  const backdrop = document.createElement('div');

  backdrop.innerHTML = `

        <option value="__new__">➕ Someone new…</option>

      </div>

        <div class="switch on" id="obApprove"><div class="dot"></div></div>
      </div>
      <p class="hint">Turn off to review the receipt first.</p>

      <button class="btn btn-outline btn-small" id="obCancel" style="width:100%;margin-top:8px;">Cancel</button>
    </div>`;
  document.body.appendChild(backdrop);

  const sel = backdrop.querySelector('#obMember');

  const approve = backdrop.querySelector('#obApprove');
  if (!sel.value || (meId && !members[meId])) sel.selectedIndex = 0;

// Re-spreads the amounts of the still-empty boxes so ALL boxes add up to exactly the goal.
async function fitAmountsToGoal(){
  if (!state.me.isAdmin){ toast('Only admins can change box amounts'); return false; }
  const boxes = await sget(keyBoxes(state.code), true) || state.boxes;
  const goal = Number(state.meta.goal||0);
  const empties = boxes.map((b,i)=>i).filter(i => boxes[i].status === 'empty');
  const taken = boxes.reduce((s,b)=> s + (b.status === 'empty' ? 0 : Number(b.amount||0)), 0);
  const remaining = goal - taken;
  if (!empties.length){ toast('No empty boxes left to adjust.'); return false; }
  if (remaining < empties.length){ toast('Goal is already covered by saved/pending boxes — raise the goal or add boxes.'); return false; }
  const base = Math.floor(remaining / empties.length);
  let extra = remaining - base * empties.length;
  empties.forEach(i => { boxes[i].amount = base + (extra > 0 ? 1 : 0); if (extra > 0) extra--; });
  const ok = await sset(keyBoxes(state.code), boxes, true);
  if (!ok){ toast('⚠️ Could not save — try again'); return false; }
  state.boxes = boxes;
  toast('Boxes now add up to ' + peso(boxesTotal()));
  render();
  return true;
}

function gcd2(a,b){ return b ? gcd2(b, a % b) : a; }

// Picks `count` amounts from `denoms` that add up to exactly `target` (or returns null if impossible).
// Uses a small table of reachable sums, then builds the list at random so the mix looks natural.
function assignDenominations(count, target, denoms){
  const g = denoms.reduce(gcd2);
  if (target % g !== 0) return null;
  const T = target / g, ds = denoms.map(d => d / g);
  if ((count + 1) * (T + 1) > 6000000) return 'toolarge';
  const reach = [];
  for (let k = 0; k <= count; k++) reach.push(new Uint8Array(T + 1));
  reach[0][0] = 1;
  for (let k = 1; k <= count; k++){
    for (let s = 0; s <= T; s++){
      for (let j = 0; j < ds.length; j++){
        if (s >= ds[j] && reach[k-1][s - ds[j]]){ reach[k][s] = 1; break; }
      }
    }
  }
  if (!reach[count][T]) return null;
  const out = [];
  let t = T;
  for (let n = count; n >= 1; n--){
    const avg = t / n;
    const options = ds.filter(d => t >= d && reach[n-1][t - d]);
    // lean toward bills near the average still needed, but keep every bill possible
    const w = options.map(d => 1 / (1 + 0.5 * Math.pow(Math.log(d / avg), 2)));
    let r = Math.random() * w.reduce((a,b) => a + b, 0), pick = options[options.length - 1];
    for (let i = 0; i < options.length; i++){ r -= w[i]; if (r <= 0){ pick = options[i]; break; } }
    out.push(pick * g);
    t -= pick;
  }
  for (let i = out.length - 1; i > 0; i--){           // shuffle positions
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = out[i]; out[i] = out[j]; out[j] = tmp;
  }
  return out;
}

async function assignBills(text){
  if (!state.me.isAdmin){ toast('Only admins can change box amounts'); return false; }
  const denoms = Array.from(new Set(String(text||'').split(/[\s,;]+/).map(Number).filter(n => n > 0 && Math.floor(n) === n))).sort((a,b) => a - b);
  if (!denoms.length){ toast('Enter bills like 10, 20, 50, 100, 200, 1000'); return false; }
  const boxes = await sget(keyBoxes(state.code), true) || state.boxes;
  const goal = Number(state.meta.goal||0);
  const empties = boxes.map((b,i) => i).filter(i => boxes[i].status === 'empty');
  const taken = boxes.reduce((s,b) => s + (b.status === 'empty' ? 0 : Number(b.amount||0)), 0);
  const target = goal - taken;
  if (!empties.length){ toast('No empty boxes left to adjust.'); return false; }
  if (target <= 0){ toast('Saved/pending boxes already cover the goal.'); return false; }
  const result = assignDenominations(empties.length, target, denoms);
  if (result === 'toolarge'){ toast('Goal is too large for this — use bigger bills.'); return false; }
  if (!result){
    toast('Can’t make ' + peso(target) + ' from ' + empties.length + ' boxes with those bills (possible range ' +
      peso(empties.length * denoms[0]) + '–' + peso(empties.length * denoms[denoms.length-1]) + '). Change the number of boxes or bills.');
    return false;
  }
  empties.forEach((i, n) => { boxes[i].amount = result[n]; });
  const ok = await sset(keyBoxes(state.code), boxes, true);
  if (!ok){ toast('⚠️ Could not save — try again'); return false; }
  state.boxes = boxes;
  const counts = {};
  result.forEach(a => { counts[a] = (counts[a]||0) + 1; });
  toast('Done — total ' + peso(boxesTotal()) + ' · ' + Object.keys(counts).map(Number).sort((a,b)=>b-a).map(a => '₱' + a + '×' + counts[a]).join(', '));
  render();
  return true;
}

function progressPct(){
  const approvedSum = (state.boxes||[]).filter(b=>b.status==='approved')
    .reduce((s,b)=>s+Number(b.amount||0),0);
  const goal = state.meta.goal || 1;
  return Math.min(100, Math.round((approvedSum/goal)*1000)/10);
}
function savedTotal(){
  return (state.boxes||[]).filter(b=>b.status==='approved').reduce((s,b)=>s+Number(b.amount||0),0);
}
function leaderboard(){
  const totals = {};
  (state.boxes||[]).filter(b=>b.status==='approved').forEach(b=>{
    totals[b.ownerId] = (totals[b.ownerId]||0) + Number(b.amount||0);
  });
  const rows = Object.keys(state.members||{}).map(id => ({
    id, name: state.members[id].name, amount: totals[id] || 0
  }));
  rows.sort((a,b)=> b.amount - a.amount);
  return rows;
}
function hasCustomPhotos(){
  return ["m0","m25","m50","m75","m100"].some(k => state.photos && state.photos[k]);
}
function morphSources(pct){
  const stops = [0,25,50,75,100];
  const slots = ['m0','m25','m50','m75','m100'];
  let lo = 0;
  for (let i=0;i<stops.length-1;i++){ if (pct >= stops[i]) lo = i; }
  const hi = Math.min(lo+1, stops.length-1);
  const range = stops[hi]-stops[lo] || 1;
  const t = Math.max(0, Math.min(1, (pct - stops[lo]) / range));
  return {
    loImg: state.photos[slots[lo]] || BELA_PHOTO, hiImg: state.photos[slots[hi]] || BELA_PHOTO,
    loOpacity: 1-t, hiOpacity: t
  };
}

    <p class="grid-hint">${state.meta.status === 'ended' ? 'This challenge has ended. New receipts are closed, but admins can still manage settings and boxes.' : state.selectMode ? 'Tap open boxes to select them, then upload one receipt to cover all of them.' : (state.me.isAdmin ? 'Tap an open box to upload a receipt — you can choose which team member it’s for.' : 'Tap an open box, upload your receipt, and wait for admin approval.')}</p>
    ${state.me.isAdmin && state.meta.status !== 'ended' && boxesTotal() < Number(state.meta.goal||0) ? `
    <div class="select-bar" style="margin:0 0 10px;flex-direction:column;align-items:flex-start;">
      <span>⚠️ Boxes only add up to ${peso(boxesTotal())} — ${peso(Number(state.meta.goal||0) - boxesTotal())} short of the ${peso(state.meta.goal)} goal, so it can’t be reached.</span>
      <span style="font-weight:400;">Open ⚙️ Settings → “Fit box amounts to goal”.</span>
    </div>` : ''}
    <div class="env-grid">${gridCells}</div>
    ${state.selectMode ? `
    <div class="select-bar">
      <span>${state.selected.length} selected · ${peso(selectedAmount)}</span>
      <button class="btn btn-primary btn-small" id="submitSelectedBtn" ${!state.selected.length ? 'disabled' : ''}>Upload 1 photo</button>
    </div>` : ''}
    <div class="actions-row">
      <button class="btn btn-outline" id="shareBtn">Copy join code</button>
      ${state.meta.status !== 'ended' ? `<button class="btn btn-outline" id="selectModeBtn">${state.selectMode ? 'Cancel select' : '☑️ Select multiple'}</button>` : ''}
      ${state.me.isAdmin && state.meta.status !== 'ended' ? `<button class="btn btn-danger" id="endChallengeBtn" ${savedTotal() < Number(state.meta.goal||0) ? 'disabled' : ''}>🏁 End challenge</button>` : ''}
      ${state.me.isAdmin ? `<button class="btn btn-outline" id="exportReceiptsBtn">⬇️ Export all receipts</button>` : ''}
      ${!state.me.isAdmin ? `<button class="btn btn-outline" id="adminLoginBtn">I'm an admin</button>` : ''}
    </div>
  </div>

  <p class="footer-note">Progress, photos, and receipts are saved automatically and sync for everyone with the join code.</p>
  `;
}

function bindChallenge(){
  document.querySelectorAll('[data-copynum]').forEach(btn => {
    btn.onclick = async () => {
      const p = PAY_NUMBERS[Number(btn.dataset.copynum)];
      try { await navigator.clipboard.writeText(p.num); }
      catch(e){ const t=document.createElement('textarea'); t.value=p.num; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(_){} t.remove(); }
      toast(p.label + ' number copied');
    };
  });
  const qrImg = document.getElementById('payQrImg');
  if (qrImg) qrImg.onclick = () => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:998;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:10px;';
    ov.innerHTML = '<img src="'+PAYMENT_QR+'" style="max-width:100%;max-height:100%;border-radius:10px;">';
    ov.onclick = () => ov.remove();
    document.body.appendChild(ov);
  };
  document.getElementById('settingsBtn').onclick = openSettings;
  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.onclick = () => {
    confirmModal('Go back to the join page? You can rejoin anytime with the join code.', () => {
      leaveChallenge();
    });
  };
  const avatarWrap = document.getElementById('myAvatarWrap');
  if (avatarWrap){
    avatarWrap.onclick = () => pickPhoto(uploadMyAvatar);
  }
  document.querySelectorAll('.env').forEach(el => {
    el.onclick = () => {
      const i = parseInt(el.dataset.i);
      if (state.selectMode) toggleSelectBox(i);
      else onEnvClick(i);
    };
  });
  document.querySelectorAll('[data-approve]').forEach(el => {
    el.onclick = () => approveBox(parseInt(el.dataset.approve));
  });
  document.querySelectorAll('[data-reject]').forEach(el => {
    el.onclick = () => rejectBox(parseInt(el.dataset.reject));
  });
  document.querySelectorAll('[data-download]').forEach(el => {
    el.onclick = () => {
      const i = parseInt(el.dataset.download);
      const b = state.boxes[i];
      const owner = state.members[b.ownerId] ? state.members[b.ownerId].name.replace(/[^a-z0-9]/gi,'_') : 'receipt';
      const ext = (b.receipt.match(/^data:image\/(\w+);/) || [,'jpg'])[1];
      downloadDataUrl(b.receipt, `box-${String(i+1).padStart(2,'0')}-${owner}.${ext}`);
    };
  });
  const exportBtn = document.getElementById('exportReceiptsBtn');
  if (exportBtn) exportBtn.onclick = exportAllReceipts;
  document.querySelectorAll('[data-view]').forEach(el => {
    el.onclick = () => showImagePreview(el.src);
  });
  const shareBtn = document.getElementById('shareBtn');
  if (shareBtn) shareBtn.onclick = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(state.code).catch(()=>{});
    toast('Join code ' + state.code + ' copied');
  };
  const adminBtn = document.getElementById('adminLoginBtn');
  if (adminBtn) adminBtn.onclick = () => openAdminLoginModal();
  const selectModeBtn = document.getElementById('selectModeBtn');
  if (selectModeBtn) selectModeBtn.onclick = toggleSelectMode;
  const endChallengeBtn = document.getElementById('endChallengeBtn');
  if (endChallengeBtn) endChallengeBtn.onclick = endChallenge;
  const submitSelectedBtn = document.getElementById('submitSelectedBtn');
  if (submitSelectedBtn) submitSelectedBtn.onclick = submitSelectedBoxes;
}

/* ---- image preview modal ---- */
function showImagePreview(src){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="img-modal-sheet">
      <button class="modal-close" id="closeImgModal">✕</button>
      <h3>Receipt photo</h3>
      <img src="${src}">
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('closeImgModal').onclick = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
}

/* ---- review a single pending box — admin only (tapped directly from the grid) ---- */
function openReview(i){
  const box = state.boxes[i];
  const ownerName = state.members[box.ownerId] ? state.members[box.ownerId].name : 'Member';
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <button class="modal-close" id="closeReviewModal">✕</button>
      <h3>Review box #${i+1} · ${peso(box.amount)}</h3>
      <div style="text-align:center;">
        ${box.receipt
          ? `<img src="${box.receipt}" id="rThumb" style="width:200px;height:200px;object-fit:cover;border-radius:14px;margin:4px 0 14px;box-shadow:var(--shadow);cursor:pointer;">`
          : `<p class="empty-note">No photo on file</p>`}
      </div>
      <p style="font-size:13px;color:var(--ink);text-align:center;margin:0 0 14px;">Submitted by <b>${ownerName}</b></p>
      <div class="actions-row">
        <button class="btn" id="rApproveBtn" style="background:var(--green);color:#fff;">✅ Approve</button>
        <button class="btn btn-danger" id="rRejectBtn">Reject</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('closeReviewModal').onclick = () => backdrop.remove();
  const thumb = document.getElementById('rThumb');
  if (thumb) thumb.onclick = () => showImagePreview(box.receipt);
  document.getElementById('rApproveBtn').onclick = async () => {
    await approveBox(i);
    backdrop.remove();
  };
  document.getElementById('rRejectBtn').onclick = async () => {
    await rejectBox(i);
    backdrop.remove();
  };
}

/* ---- manage a saved (approved) box — admin only ---- */
function openManageApproved(i){
  const box = state.boxes[i];
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <button class="modal-close" id="closeManageModal">✕</button>
      <h3>Manage box #${i+1} · ${peso(box.amount)}</h3>
      <div style="text-align:center;">
        ${box.receipt
          ? `<img src="${box.receipt}" id="mThumb" style="width:160px;height:160px;object-fit:cover;border-radius:14px;margin:4px 0 14px;box-shadow:var(--shadow);cursor:pointer;">`
          : `<p class="empty-note">No photo on file</p>`}
      </div>

      <label>Saved by</label>
      <select id="mReassign">
        ${Object.keys(state.members).map(id => `<option value="${id}" ${id===box.ownerId?'selected':''}>${state.members[id].name}</option>`).join('')}
      </select>
      <button class="btn btn-outline btn-small" id="mSaveName" style="width:100%;margin-top:8px;">Save name change</button>

      <label style="margin-top:16px;">Photo</label>
      <button class="btn btn-outline btn-small" id="mChangePhotoBtn" style="width:100%;">📷 Change photo</button>
      ${box.receipt ? `<button class="btn btn-outline btn-small" id="mDownloadBtn" style="width:100%;margin-top:8px;">⬇️ Download photo</button>` : ''}
      <input type="file" id="mPhotoInput" accept="image/*">

      <button class="btn btn-danger" id="mRemoveBtn" style="width:100%;margin-top:18px;">🗑️ Remove this saved entry</button>
    </div>`;
  document.body.appendChild(backdrop);

  document.getElementById('closeManageModal').onclick = () => backdrop.remove();
  const thumb = document.getElementById('mThumb');
  if (thumb) thumb.onclick = () => showImagePreview(box.receipt);

  const downloadBtn = document.getElementById('mDownloadBtn');
  if (downloadBtn) downloadBtn.onclick = () => {
    const owner = state.members[box.ownerId] ? state.members[box.ownerId].name.replace(/[^a-z0-9]/gi,'_') : 'receipt';
    const ext = (box.receipt.match(/^data:image\/(\w+);/) || [,'jpg'])[1];
    downloadDataUrl(box.receipt, `box-${String(i+1).padStart(2,'0')}-${owner}.${ext}`);
  };

  document.getElementById('mSaveName').onclick = async () => {
    const newOwner = document.getElementById('mReassign').value;
    if (newOwner === box.ownerId){ backdrop.remove(); return; }
    await reassignBox(i, newOwner);
    backdrop.remove();
  };

  const photoInput = document.getElementById('mPhotoInput');
  document.getElementById('mChangePhotoBtn').onclick = () => photoInput.click();
  photoInput.onchange = async () => {
    const file = photoInput.files[0];
    if (!file) return;
    await changeBoxPhoto(i, file);
    backdrop.remove();
  };

  document.getElementById('mRemoveBtn').onclick = () => {
    confirmModal('Remove this saved box? It will go back to empty and can be re-uploaded.', async () => {
      await rejectBox(i);
      backdrop.remove();
    });
  };
}

/* ---- settings modal ---- */
function openAdminLoginModal(onSuccess){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <button class="modal-close" id="closeAdminLoginModal">✕</button>
      <h3>Admin login</h3>
      <label>Admin PIN</label>
      <input id="adminPinInput" type="password" placeholder="Enter admin PIN" inputmode="numeric">
      <button class="btn btn-primary" id="adminPinSubmitBtn">Log in</button>
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('closeAdminLoginModal').onclick = () => backdrop.remove();
  const pinInput = document.getElementById('adminPinInput');
  const submit = async () => {
    const pin = pinInput.value.trim();
    if (!pin) return;
    const wasAdmin = state.me.isAdmin;
    await adminLogin(pin);
    backdrop.remove();
    if (!wasAdmin && state.me.isAdmin && onSuccess) onSuccess();
  };
  document.getElementById('adminPinSubmitBtn').onclick = submit;
  pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
}

function openSettings(){
  const meta = state.meta;
  const slots = [['m0','0%'],['m25','25%'],['m50','50%'],['m75','75%'],['m100','100%']];
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <button class="modal-close" id="closeModal">✕</button>
      <h3>Challenge settings</h3>

      <div class="toggle-row">
        <span>🔒 Locked (freeze title/amounts/photos)</span>
        <div class="switch ${meta.locked?'on':''}" id="lockSwitch"><div class="dot"></div></div>
      </div>

      ${state.me.isAdmin ? `
      <div class="toggle-row">
        <span>🙈 Hide pending receipts from other players</span>
        <div class="switch ${meta.hidePending?'on':''}" id="hidePendingSwitch"><div class="dot"></div></div>
      </div>
      ` : ''}

      ${state.me.isAdmin ? `
      <label>Title</label>
      <input id="sTitle" type="text" value="${meta.title}">
      <label>Subtitle</label>
      <input id="sSub" type="text" value="${meta.subtitle||''}">
      <label>Goal (₱)</label>
      <input id="sGoal" type="number" value="${meta.goal}">
      <label>Amount per box (₱)</label>
      <input id="sBoxAmt" type="number" value="${meta.boxAmount}">
      <label>Number of boxes</label>
      <input id="sNumBoxes" type="number" value="${meta.numBoxes}">
      <button class="btn btn-primary" id="saveSettingsBtn" ${meta.locked?'disabled':''}>Save changes</button>

      <label style="margin-top:16px;">🎯 Boxes vs goal</label>
      <p class="hint" style="color:${boxesTotal() < Number(meta.goal||0) ? '#c0392b' : 'var(--green)'};font-weight:700;">Boxes add up to ${peso(boxesTotal())} of ${peso(meta.goal)} goal${boxesTotal() < Number(meta.goal||0) ? ' — short' : ''}</p>
      <button class="btn btn-primary" id="fitGoalBtn" style="margin-top:6px;" ${meta.locked?'disabled':''}>🎯 Fit box amounts to goal</button>
      <p class="empty-note" style="text-align:left;padding:4px 0 0;">Re-spreads the empty boxes so everything adds up to exactly the goal. Saved and pending boxes keep their amount.</p>

      <label style="margin-top:16px;">💵 Peso bills (₱10, 20, 50, 100…)</label>
      <input id="sBills" type="text" value="10, 20, 50, 100, 200, 1000" inputmode="text">
      <button class="btn btn-primary" id="assignBillsBtn" style="margin-top:8px;" ${meta.locked?'disabled':''}>💵 Give empty boxes these bills</button>
      <p class="empty-note" style="text-align:left;padding:4px 0 0;">Mixes the bills across the empty boxes so everything adds up to exactly the ${peso(meta.goal)} goal. Saved and pending boxes keep their amount.</p>

      <label style="margin-top:16px;">🎲 Randomize amounts (different amount per box)</label>
      <div style="display:flex;gap:8px;">
        <input id="sRandMin" type="number" placeholder="Min ₱" value="10" style="flex:1;">
        <input id="sRandMax" type="number" placeholder="Max ₱" value="500" style="flex:1;">
      </div>
      <button class="btn btn-outline" id="shuffleAmountsBtn" style="margin-top:8px;" ${meta.locked?'disabled':''}>🎲 Shuffle box amounts</button>
      <p class="empty-note" style="text-align:left;padding:4px 0 0;">Only affects boxes that are still empty — already-saved or pending boxes keep their amount.</p>

      <label style="margin-top:16px;">Milestone photos (for the morphing frame)</label>
      <div class="mini-photo-grid">
        ${slots.map(([slot,lbl]) => `
          <div class="mini-photo" data-slot="${slot}">
            ${state.photos[slot] ? `<img src="${state.photos[slot]}">` : '📷'}
            <span class="lbl">${lbl}</span>
          </div>`).join('')}
      </div>
      <input type="file" id="photoInput" accept="image/*">

      <label style="margin-top:16px;">Add another admin</label>
      <input id="newAdminName" type="text" placeholder="Name">
      <input id="newAdminPin" type="password" placeholder="PIN" style="margin-top:6px;">
      <button class="btn btn-outline" id="addAdminBtn" style="margin-top:8px;">Add admin</button>

      <label style="margin-top:16px;">Danger zone</label>
      <button class="btn btn-outline" id="resetBoxesBtn" style="margin-top:0;">🔄 Reset progress (clear all boxes)</button>
      <button class="btn btn-danger" id="deleteChallengeBtn" style="margin-top:8px;">🗑️ Delete challenge</button>
      ` : `
      <p class="empty-note">Only admins can edit the title, goal, amounts, and photos.</p>
      <button class="btn btn-primary" id="settingsAdminLoginBtn">🔑 Log in as admin</button>
      `}
    </div>`;
  document.body.appendChild(backdrop);

  document.getElementById('closeModal').onclick = () => backdrop.remove();

  const settingsAdminLoginBtn = document.getElementById('settingsAdminLoginBtn');
  if (settingsAdminLoginBtn){
    settingsAdminLoginBtn.onclick = () => {
      openAdminLoginModal(() => { backdrop.remove(); openSettings(); });
    };
  }

  const lockSwitch = document.getElementById('lockSwitch');
  lockSwitch.onclick = async () => {
    if (!state.me.isAdmin){ toast('Only admins can lock/unlock'); return; }
    const wasLocked = state.meta.locked;
    await toggleLock();
    if (state.meta.locked === wasLocked) return; // save failed, toggleLock already toasted
    lockSwitch.classList.toggle('on');
    const saveBtn = document.getElementById('saveSettingsBtn');
    if (saveBtn) saveBtn.disabled = state.meta.locked;
  };

  const hidePendingSwitch = document.getElementById('hidePendingSwitch');
  if (hidePendingSwitch){
    hidePendingSwitch.onclick = async () => {
      const was = state.meta.hidePending;
      await toggleHidePending();
      if (state.meta.hidePending === was) return; // save failed, already toasted
      hidePendingSwitch.classList.toggle('on');
    };
  }

  if (state.me.isAdmin){
    document.getElementById('saveSettingsBtn').onclick = async () => {
      if (state.meta.locked){ toast('Unlock first'); return; }
      await saveSettings({
        title: document.getElementById('sTitle').value.trim() || state.meta.title,
        subtitle: document.getElementById('sSub').value.trim(),
        goal: Number(document.getElementById('sGoal').value) || state.meta.goal,
        boxAmount: Number(document.getElementById('sBoxAmt').value) || state.meta.boxAmount,
        numBoxes: Number(document.getElementById('sNumBoxes').value) || state.meta.numBoxes,
      });
      backdrop.remove();
    };
    document.getElementById('fitGoalBtn').onclick = async () => {
      if (state.meta.locked){ toast('Unlock first'); return; }
      if (await fitAmountsToGoal()) backdrop.remove();
    };
    document.getElementById('assignBillsBtn').onclick = async () => {
      if (state.meta.locked){ toast('Unlock first'); return; }
      if (await assignBills(document.getElementById('sBills').value)) backdrop.remove();
    };
    document.getElementById('shuffleAmountsBtn').onclick = async () => {
      if (state.meta.locked){ toast('Unlock first'); return; }
      const min = Number(document.getElementById('sRandMin').value);
      const max = Number(document.getElementById('sRandMax').value);
      if (!min || !max || min <= 0 || max < min){ toast('Enter a valid min and max amount'); return; }
      await shuffleBoxAmounts(min, max);
      backdrop.remove();
    };
    const photoInput = document.getElementById('photoInput');
    document.querySelectorAll('.mini-photo').forEach(el => {
      el.onclick = () => {
        if (state.meta.locked){ toast('Unlock first'); return; }
        photoInput.dataset.slot = el.dataset.slot;
        photoInput.click();
      };
    });
    photoInput.onchange = async () => {
      const file = photoInput.files[0];
      if (!file) return;
      await setMilestonePhoto(photoInput.dataset.slot, file);
      backdrop.remove();
      openSettings();
    };
    document.getElementById('addAdminBtn').onclick = async () => {
      const n = document.getElementById('newAdminName').value.trim();
      const p = document.getElementById('newAdminPin').value.trim();
      if (!n || !p){ toast('Enter name and PIN'); return; }
      await addAdmin(n, p);
      backdrop.remove();
    };
    document.getElementById('resetBoxesBtn').onclick = () => {
      backdrop.remove();
      resetBoxes();
    };
    document.getElementById('deleteChallengeBtn').onclick = () => {
      backdrop.remove();
      deleteChallenge();
    };
  }
}

/* ================= boot ================= */
document.getElementById('errBannerClose').onclick = () => {
  document.getElementById('errBanner').style.display = 'none';
};
document.getElementById('errBannerCopy').onclick = () => {
  const text = document.getElementById('errBannerText').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Copied')).catch(() => toast('Could not copy — select the text manually'));
};
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => tryRejoinFromMemory());
} else {
  tryRejoinFromMemory();
}
</script>
